containers:
- name: nginx-demo
  image: gsafetyweiwen/nginx-demo:latest

  ports:
  - containerPort: 80

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10